backend:
  name: github
  repo: bdmarketingbeast/bdmarketingbeastt
  branch: main
media_folder: uploads
public_folder: /uploads
locale: en
site_url: /
collections:
- name: blog
  label: Blog posts
  label_singular: Blog post
  folder: content/blog
  create: true
  extension: md
  slug: '{{slug}}'
  summary: '{{title}}'
  sortable_fields:
  - date
  - title
  fields:
  - label: Title
    name: title
    widget: string
  - label: Publish date
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD MMM YYYY
    time_format: false
  - label: Category (small label on the card)
    name: category
    widget: string
    default: Marketing
  - label: Short summary (shown on the blog page card)
    name: summary
    widget: text
  - label: Card image
    name: image
    widget: image
    required: false
    hint: Wide photo works best (16:9).
  - label: Draft (tick to hide this post from the website)
    name: draft
    widget: boolean
    default: false
  - label: Post content
    name: body
    widget: markdown
- name: pages
  label: Extra pages (About, landing pages, thank-you pages)
  label_singular: Page
  folder: content/pages
  create: true
  extension: md
  slug: '{{slug}}'
  summary: '{{title}}'
  fields:
  - label: Page title
    name: title
    widget: string
  - label: Description for Google (one sentence)
    name: description
    widget: text
    required: false
  - label: Page type
    name: layout
    widget: select
    options:
    - standard
    - landing
    - thank-you
    default: standard
    hint: standard = normal page with menu. landing = no menu, built for ads. thank-you = minimal page for after a form, hidden from Google.
  - label: Show the title at the top
    name: show_title
    widget: boolean
    default: true
  - label: Hide from Google (noindex)
    name: noindex
    widget: boolean
    default: false
  - label: Tag Manager event for thank-you pages
    name: event
    widget: string
    required: false
    hint: Default lead_thank_you_view
  - label: Share image
    name: image
    widget: image
    required: false
  - label: Draft (tick to hide this page from the website)
    name: draft
    widget: boolean
    default: false
  - label: Text at the top
    name: body
    widget: markdown
    required: false
  - label: Page sections
    hint: Click Add to put in a new section. Use the arrows or drag to reorder, and the X to remove.
    name: sections
    widget: list
    required: false
    types:
    - label: Hero (top banner)
      name: hero
      widget: object
      summary: 'Hero: {{title}}'
      fields:
      - label: Anchor
        name: anchor
        widget: string
        required: false
      - label: Small badge text
        name: badge
        widget: string
        required: false
      - label: Main headline
        name: title
        widget: string
        hint: Put *stars* around words to make them blue.
      - label: Text under headline
        name: lead
        widget: text
        required: false
      - label: Button 1 text
        name: button_text
        widget: string
        required: false
      - label: Button 1 link
        name: button_link
        widget: string
        required: false
        hint: Type /#contact (scroll to a section), /blog/ , /about/ , a full https:// address, or the word call or whatsapp for phone buttons.
      - label: Button 2 text (use {phone} for your number)
        name: button2_text
        widget: string
        required: false
      - label: Button 2 link
        name: button2_link
        widget: string
        required: false
        hint: Type /#contact (scroll to a section), /blog/ , /about/ , a full https:// address, or the word call or whatsapp for phone buttons.
      - label: Trust points (small ticks under buttons)
        name: trust
        widget: list
        required: false
        field:
          label: Point
          name: point
          widget: string
      - label: Background photo
        name: image
        widget: image
        required: false
      - label: Short hero (smaller banner)
        name: short
        widget: boolean
        default: false
      - label: Moving network animation
        name: animation
        widget: boolean
        default: true
    - label: Scrolling words strip
      name: marquee
      widget: object
      summary: Strip
      fields:
      - label: Words
        name: words
        widget: list
        required: false
        field:
          label: Word
          name: word
          widget: string
    - label: Cards (services, features, products)
      name: cards
      widget: object
      summary: 'Cards: {{title}}'
      fields:
      - label: Section anchor
        name: anchor
        widget: string
        required: false
        hint: 'A short name so menu links can jump here. Example: services lets the menu link /#services work.'
      - label: Background
        name: background
        widget: select
        options:
        - normal
        - alt
        default: normal
        hint: alt = slightly different shade to separate sections
      - label: Small label above the title
        name: eyebrow
        widget: string
        required: false
      - label: Title
        name: title
        widget: string
        required: false
        hint: 'Put *stars* around words to make them blue. Example: Grow *faster*'
      - label: Text under the title
        name: subtitle
        widget: text
        required: false
      - label: Cards per row
        name: columns
        widget: select
        options:
        - '2'
        - '3'
        - '4'
        default: '3'
      - label: Cards
        name: cards
        widget: list
        required: false
        fields:
        - label: Card title
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
          required: false
        - label: Picture (optional, replaces the icon)
          name: image
          widget: image
          required: false
        - label: Icon
          name: icon
          widget: select
          options:
          - none
          - megaphone
          - search
          - monitor
          - trend
          - funnel
          - user
          - mail
          - star
          - phone
          - chart
          - heart
          - home
          - tools
          - shield
          - clock
          - globe
          default: star
        - label: Bullet points
          name: bullets
          widget: list
          required: false
          field:
            label: Bullet
            name: bullet
            widget: string
        - label: Link text
          name: link_text
          widget: string
          required: false
        - label: Link address
          name: link_url
          widget: string
          required: false
          hint: Type /#contact (scroll to a section), /blog/ , /about/ , a full https:// address, or the word call or whatsapp for phone buttons.
        summary: '{{fields.title}}'
    - label: Numbers strip
      name: stats
      widget: object
      summary: Numbers
      fields:
      - label: Numbers
        name: items
        widget: list
        required: false
        fields:
        - label: Counting number (leave empty to show words)
          name: count
          widget: number
          value_type: int
          required: false
        - label: After the number (like % or h)
          name: suffix
          widget: string
          required: false
        - label: Words instead of a number
          name: text
          widget: string
          required: false
        - label: Label under it
          name: label
          widget: string
        summary: '{{fields.label}}'
    - label: Steps (how it works)
